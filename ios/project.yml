name: SammyWord
options:
  bundleIdPrefix: com.samschnaars
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "17"
    SWIFT_VERSION: "5.0"
    # We supply our own Info.plist files, so don't auto-generate them.
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1"   # iPhone only (no iPad screenshots needed)
    CODE_SIGN_STYLE: Automatic
    # Your paid Apple Developer team — keeps signing set across project regen.
    DEVELOPMENT_TEAM: N5UFSQDWQC

targets:
  # ---- Container iOS app (required host for the iMessage extension) ----
  SammyWord:
    type: application
    platform: iOS
    sources:
      - SammyWord
      # Shared with the extension so the host app wears the same pixel art.
      - SammyWordMessages/PixelArt.swift
      - SammyWordMessages/Theme.swift
      - SammyWordMessages/GameMessage.swift
      - SammyWordMessages/DailyStore.swift
      - SammyWordMessages/Flags.swift
      - SammyWordMessages/SeededRNG.swift
      - SammyWordMessages/Caption.swift
    settings:
      base:
        INFOPLIST_FILE: SammyWord/Info.plist
        TARGETED_DEVICE_FAMILY: "1"   # XcodeGen defaults targets to iPhone + iPad; keep iPhone only
        PRODUCT_BUNDLE_IDENTIFIER: com.samschnaars.SammyWord
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SammyWordMessages
        embed: true

  # ---- iMessage extension (the game lives here) ----
  SammyWordMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - SammyWordMessages
    settings:
      base:
        INFOPLIST_FILE: SammyWordMessages/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.samschnaars.SammyWord.SammyWordMessages
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
