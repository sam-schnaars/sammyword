<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2a1a12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Motherlode — concept A</title>
    <link rel="stylesheet" href="./kit.css" />
    <style>
      :root { --ink: #2a1a12; --wood: #a5673f; --wood-d: #74482d; --wood-l: #c98a57; --paper: #f6e7c8; --gold: #ffd24a; }
      body { font-family: 'Pixelify Sans', monospace; color: var(--paper); background: #1a100b; }
      .hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; font-size: 18px; font-weight: 700; text-shadow: 2px 2px 0 var(--ink); pointer-events: none; }
      .hud b { color: var(--gold); font-size: 24px; }
      .timebar { position: absolute; top: 44px; left: 12px; right: 12px; height: 10px; border: 2px solid var(--ink); background: #0006; }
      .timebar i { display: block; height: 100%; background: var(--gold); transition: width 1s linear; }
      .timebar.low i { background: #ff6b4a; }
      #toast { position: absolute; left: 0; right: 0; top: 17%; text-align: center; font-weight: 700; text-shadow: 2px 2px 0 var(--ink); pointer-events: none; opacity: 0; }
      #toast.on { animation: rise 1.3s ease-out; }
      #toast .big { font-size: 34px; display: block; }
      #toast .sm { font-size: 18px; }
      @keyframes rise { 0% { opacity: 0; transform: translateY(14px); } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-22px); } }
      .t1 { color: #e8dcc0; } .t2 { color: #8fe38a; } .t3 { color: #6fd3ff; } .t4 { color: var(--gold); }
      .panel { background: var(--wood); border-top: 4px solid var(--ink); padding: 10px 12px 14px; box-shadow: inset 0 4px 0 var(--wood-l), inset 0 -4px 0 var(--wood-d); }
      .sign { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); padding: 8px 10px; font-size: 20px; font-weight: 700; text-align: center; box-shadow: 3px 3px 0 var(--wood-d); }
      form { display: flex; gap: 8px; margin-top: 10px; }
      input { flex: 1; min-width: 0; font-size: 18px; padding: 10px; background: #fff8e6; color: var(--ink); border: 3px solid var(--ink); outline: none; }
      input:focus { background: #fff; box-shadow: 0 0 0 3px var(--gold); }
      .btn { background: var(--gold); color: var(--ink); border: 3px solid var(--ink); padding: 10px 16px; font-weight: 700; font-size: 18px; box-shadow: 0 4px 0 #b8860b; }
      .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8860b; }
      #msg { min-height: 20px; margin-top: 6px; font-size: 15px; text-align: center; color: #ffe1c2; }
      #log { display: flex; gap: 6px; flex-wrap: nowrap; overflow: hidden; margin-top: 4px; min-height: 26px; }
      .chip { flex-shrink: 0; font-size: 13px; padding: 3px 6px; background: var(--ink); border: 2px solid currentColor; white-space: nowrap; }
      .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; text-align: center; background: #1a100bcc; z-index: 5; overflow-y: auto; }
      .overlay.title { background: linear-gradient(#1a100b00 36%, #1a100be8 50%); justify-content: flex-end; padding-bottom: 7vh; }
      h1 { font-size: 46px; line-height: 0.95; color: var(--gold); text-shadow: 3px 3px 0 var(--ink), 6px 6px 0 #7a2f25; letter-spacing: 1px; }
      .overlay p { font-size: 17px; max-width: 320px; line-height: 1.3; text-shadow: 2px 2px 0 var(--ink); }
      .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 15px; }
      .legend span { background: var(--ink); border: 2px solid currentColor; padding: 4px 8px; }
      .result-depth { font-size: 64px; font-weight: 700; color: var(--gold); text-shadow: 4px 4px 0 var(--ink); line-height: 1; }
      .recap { width: 100%; max-width: 340px; text-align: left; font-size: 14px; display: flex; flex-direction: column; gap: 10px; }
      .recap h3 { font-size: 15px; color: var(--paper); margin-bottom: 4px; }
      .recap .row { display: flex; flex-wrap: wrap; gap: 4px; }
      .recap .missed { color: #c9b08e; font-size: 13px; margin-top: 3px; }
      a.back { color: var(--paper); font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <div class="scene">
        <canvas id="cv"></canvas>
        <div id="hud" class="hidden">
          <div class="hud"><span><b id="depth">0</b>m</span><span id="shaft">SHAFT 1/3</span><span>💎 <span id="gems">0</span></span></div>
          <div class="timebar" id="timebar"><i id="timefill" style="width: 100%"></i></div>
        </div>
        <div id="toast"></div>
        <div class="overlay title" id="title">
          <h1>MOTHER<br />LODE</h1>
          <p>Three shafts, 30 seconds each. Name <b>as many</b> answers as you can. Every answer digs — the rarer it is, the deeper you go.</p>
          <div class="legend">
            <span class="t1">Common · 1m</span><span class="t2">Solid · 3m</span>
            <span class="t3">Rare · 6m</span><span class="t4">Deep cut · 12m 💎</span>
          </div>
          <button class="btn" id="start">START DIGGING</button>
          <a class="back" href="./">← all concepts</a>
        </div>
        <div class="overlay hidden" id="over"></div>
      </div>
      <div class="panel hidden" id="panel">
        <div class="sign" id="prompt"></div>
        <form id="form" autocomplete="off">
          <input id="guess" placeholder="Type an answer…" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" />
          <button class="btn" type="submit">DIG</button>
        </form>
        <div id="msg"></div>
        <div id="log"></div>
      </div>
    </div>
    <script type="module" src="./mine.js"></script>
  </body>
</html>
